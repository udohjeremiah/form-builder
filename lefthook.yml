pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      run: pnpm prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm eslint --no-warn-ignored --fix --max-warnings=0 {staged_files}
      stage_fixed: true

prepare-commit-msg:
  commands:
    commitizen:
      interactive: true
      run: pnpm cz --hook
      env:
        LEFTHOOK: 0

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    knip:
      run: pnpm run knip
    typecheck:
      run: pnpm run typecheck
